<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <title>매일묘일</title>
</head>
<body style="margin:0;padding:0;background-color:#eef1f4;font-family:Arial,'Malgun Gothic','맑은 고딕',sans-serif;">

<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#eef1f4"
       style="margin:0;padding:0;background-color:#eef1f4;">
    <tr>
        <td align="center" style="padding:28px 10px;">

            <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" bgcolor="#ffffff"
                   style="width:600px;background-color:#ffffff;border:1px solid #c8ced8;">

                <tr>
                    <td width="52" valign="top" bgcolor="#fbfbfb"
                        style="width:52px;background-color:#fbfbfb;border-right:2px solid #d85858;">
                        <table role="presentation" width="52" cellspacing="0" cellpadding="0" border="0">
                            <tr><td height="36" style="height:36px;font-size:0;line-height:0;">&nbsp;</td></tr>
                            <tr><td align="center" height="36" style="height:36px;border-top:1px solid #e3e8ef;"><span style="font-size:13px;line-height:36px;color:#b7c0cc;">O</span></td></tr>
                            <tr><td align="center" height="36" style="height:36px;border-top:1px solid #e3e8ef;"><span style="font-size:13px;line-height:36px;color:#b7c0cc;">O</span></td></tr>
                            <tr><td align="center" height="36" style="height:36px;border-top:1px solid #e3e8ef;"><span style="font-size:13px;line-height:36px;color:#b7c0cc;">O</span></td></tr>
                            <tr><td align="center" height="36" style="height:36px;border-top:1px solid #e3e8ef;"><span style="font-size:13px;line-height:36px;color:#b7c0cc;">O</span></td></tr>
                            <tr><td align="center" height="36" style="height:36px;border-top:1px solid #e3e8ef;"><span style="font-size:13px;line-height:36px;color:#b7c0cc;">O</span></td></tr>
                            <tr><td align="center" height="36" style="height:36px;border-top:1px solid #e3e8ef;"><span style="font-size:13px;line-height:36px;color:#b7c0cc;">O</span></td></tr>
                            <tr><td height="288" style="height:288px;border-top:1px solid #e3e8ef;font-size:0;line-height:0;">&nbsp;</td></tr>
                        </table>
                    </td>

                    <td valign="top" style="padding:0;">
                        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                            <tr>
                                <td style="padding:22px 28px 14px;border-bottom:2px solid #2f5597;">
                                    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                                        <tr>
                                            <td align="left" valign="middle">
                                                <p style="margin:0;font-size:12px;line-height:18px;color:#6f7782;">
                                                    매일묘일, 고양이 밈으로 영어 한 문장
                                                </p>
                                                <p style="margin:2px 0 0;font-size:22px;line-height:30px;font-weight:bold;color:#202938;">
                                                    Cat-phrase
                                                </p>
                                            </td>
                                            <td align="right" valign="middle">
                                                <p style="margin:0;font-size:12px;line-height:18px;color:#6f7782;">Date</p>
                                                <p style="margin:2px 0 0;font-size:12px;line-height:20px;color:#6f7782;"
                                                   th:text="${date}">2026-05-04</p>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>

                            <tr>
                                <td align="center" style="padding:24px 28px 0;">
                                    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
                                           style="border:1px solid #cfd7e3;background-color:#f9fafc;">
                                        <tr>
                                            <td align="center" style="padding:12px;">
                                                <img th:src="'cid:' + ${memeAssetCid}"
                                                     alt="cat meme image"
                                                     width="492"
                                                     border="0"
                                                     style="display:block;width:100%;max-width:492px;height:auto;border:0;outline:none;text-decoration:none;"/>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td style="padding:0 16px 14px;">
                                                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                                                    <tr th:if="${(author != null and !#strings.isEmpty(author)) or (source != null and !#strings.isEmpty(source))}">
                                                        <td height="24" valign="middle" style="height:24px;border-top:1px solid #d9e3f0;vertical-align:middle;">
                                                            <p style="margin:0;font-size:12px;line-height:24px;color:#7b8491;text-align:center;">
                                                                <span th:if="${author != null and !#strings.isEmpty(author)}"
                                                                      th:text="'by ' + ${author}">by author</span>
                                                                <span th:if="${(author != null and !#strings.isEmpty(author)) and (source != null and !#strings.isEmpty(source))}"
                                                                      style="color:#aab2bd;">&nbsp; | &nbsp;</span>
                                                                <span th:if="${source != null and !#strings.isEmpty(source)}"
                                                                      th:text="${source}">source</span>
                                                            </p>
                                                        </td>
                                                    </tr>
                                                </table>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>

                            <tr>
                                <td style="padding:24px 28px 0;">
                                    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
                                           style="border-top:1px solid #d9e3f0;">
                                        <tr>
                                            <td height="36" style="height:36px;border-bottom:1px solid #d9e3f0;">
                                                <p style="margin:0;font-size:14px;line-height:36px;color:#596273;">
                                                    Vocabulary / Expression
                                                </p>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td height="36" style="height:36px;border-bottom:1px solid #d9e3f0;">
                                                <p style="margin:0;font-size:16px;line-height:36px;font-weight:bold;color:#1d2d44;"
                                                   th:text="${expressions}">english expression</p>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td height="36" style="height:36px;border-bottom:1px solid #d9e3f0;">
                                                <p style="margin:0;font-size:14px;line-height:36px;color:#d85858;font-weight:bold;"
                                                   th:text="${translation}">translations</p>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td height="36" style="height:36px;border-bottom:1px solid #d9e3f0;font-size:0;line-height:0;">&nbsp;</td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>

                            <tr th:if="${background != null and !#strings.isEmpty(background)}">
                                <td style="padding:0 28px 0;">
                                    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                                        <tr>
                                            <td height="36" style="height:36px;border-bottom:1px solid #d9e3f0;">
                                                <p style="margin:0;font-size:14px;line-height:36px;color:#596273;">
                                                    Context note
                                                </p>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td style="border-bottom:1px solid #d9e3f0;">
                                                <p style="margin:0;font-size:14px;line-height:36px;color:#293241;"
                                                   th:text="${background}">background</p>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td height="36" style="height:36px;border-bottom:1px solid #d9e3f0;font-size:0;line-height:0;">&nbsp;</td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>

                            <tr>
                                <td style="padding:14px 28px 28px;border-top:2px solid #2f5597;">
                                    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                                        <tr>
                                            <td>
                                                <p style="margin:0;font-size:12px;line-height:20px;color:#7b8491;text-align:center;">
                                                    <a th:href="${unsubscribeUrl}" target="_blank"
                                                       style="color:#5e6b7a;text-decoration:underline;">구독 취소</a>
                                                    <span style="color:#aab2bd;">&nbsp; | &nbsp;</span>
                                                    <a href="mailto:dev.mail.meow@gmail.com"
                                                       style="color:#5e6b7a;text-decoration:underline;">묘한 아이디어 제보</a>
                                                </p>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>

        </td>
    </tr>
</table>

</body>
</html>
