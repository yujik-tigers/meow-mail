<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>구독 취소 · 매일묘일</title>

    <link rel="stylesheet" crossorigin
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"/>
    <link rel="stylesheet" th:href="@{/css/view.css}"/>
</head>

<body>
<main class="result-shell">
    <section class="result-panel" aria-labelledby="unsubscribe-title">
        <div class="status-badge info">구독 취소</div>
        <div class="result-icon">?</div>
        <h1 id="unsubscribe-title" class="result-title">정말 구독을 취소하시겠어요?</h1>
        <p class="result-message">
            취소하면 다음 발송일부터 고양이 영어 노트가 더 이상 발송되지 않습니다.
            필요할 때 언제든 다시 구독할 수 있습니다.
        </p>

        <div class="button-row">
            <form th:action="@{/unsubscribe}" method="post">
                <input type="hidden" name="token" th:value="${token}"/>
                <button type="submit" class="danger-button">구독 취소하기</button>
            </form>
            <a href="/subscribe" class="secondary-button">계속 받아보기</a>
        </div>
    </section>
</main>
</body>
</html>
