<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${result.title} + ' · 매일묘일'">구독 취소 · 매일묘일</title>

    <link rel="stylesheet" crossorigin
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"/>
    <link rel="stylesheet" th:href="@{/css/view.css}"/>
</head>

<body>
<main class="result-shell">
    <section class="result-panel" aria-labelledby="unsubscribe-result-title">
        <div class="status-badge"
             th:classappend="${result.type == 'error'} ? ' error' : (${result.type == 'info'} ? ' info' : '')"
             th:text="${result.title}">구독 해지 완료</div>
        <h1 id="unsubscribe-result-title" class="result-title" th:text="${result.title}">구독 해지 완료</h1>
        <p class="result-message" th:text="${result.message}">
            구독이 정상적으로 해지되었습니다.
        </p>
        <div class="result-actions">
            <a href="/subscribe" class="secondary-button">구독 페이지로 이동</a>
        </div>
    </section>
</main>
</body>
</html>
