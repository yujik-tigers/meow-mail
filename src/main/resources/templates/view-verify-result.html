<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${success} ? '이메일 인증 완료 · 매일묘일' : '이메일 인증 실패 · 매일묘일'">매일묘일</title>

    <link rel="stylesheet" crossorigin
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"/>
    <link rel="stylesheet" th:href="@{/css/view.css}"/>
</head>

<body>
<main class="result-shell">
    <section class="result-panel" aria-labelledby="result-title">
        <div class="status-badge" th:classappend="${success} ? '' : ' error'"
             th:text="${success} ? '인증 완료' : '인증 실패'">인증 완료</div>
        <h1 id="result-title" class="result-title"
            th:text="${success} ? '구독이 시작되었습니다' : '인증 링크를 확인해 주세요'">
            구독이 시작되었습니다
        </h1>
        <p class="result-message"
           th:text="${success}
               ? '다음 발송일부터 고양이 영어 노트를 보내드립니다.'
               : '인증 링크가 만료되었거나 유효하지 않습니다. 구독 페이지에서 다시 인증 메일을 요청해 주세요.'">
            다음 발송일부터 고양이 밈 영어 노트를 보내드립니다.
        </p>
        <p class="result-message" th:if="${!success and message != null and !#strings.isEmpty(message)}"
           th:text="${message}"></p>
        <div class="result-actions">
            <button type="button" class="secondary-button" data-close-tab>창 닫기</button>
            <p class="close-fallback hidden" data-close-fallback>
                브라우저에서 자동 닫기를 막았습니다. 이 탭은 직접 닫아주세요.
            </p>
        </div>
    </section>
</main>
<script th:src="@{/js/view-result.js}"></script>
</body>
</html>
